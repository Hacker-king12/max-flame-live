<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Max Flame Live</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b10;
      color: white;
    }

    header {
      padding: 22px 18px;
      text-align: center;
      background: #10151d;
      border-bottom: 2px solid #ff5a00;
    }

    header h1 {
      margin: 0;
      color: #ff6a00;
      font-size: 27px;
    }

    header p {
      margin: 7px 0 0;
      color: #999;
    }

    .container {
      width: min(1100px, 94%);
      margin: 25px auto;
    }

    .login {
      max-width: 400px;
      margin: 70px auto;
      padding: 25px;
      background: #121821;
      border: 1px solid #293241;
      border-radius: 16px;
    }

    .login h2 {
      text-align: center;
      color: #ff6a00;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border-radius: 8px;
      border: 1px solid #333;
      background: #080b10;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #ff6500;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #error {
      color: #ff5555;
      text-align: center;
      margin-top: 12px;
    }

    #dashboard {
      display: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .topbar button {
      width: auto;
      padding: 9px 16px;
      margin: 0;
      background: #252c36;
    }

    .live {
      color: #40e477;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 15px;
    }

    .card {
      background: #121821;
      border: 1px solid #293241;
      border-radius: 15px;
      padding: 18px;
    }

    .card.playing {
      border-color: #ff6500;
    }

    .card.available {
      border-color: #22c55e;
    }

    .station {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .status {
      display: inline-block;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .status.available {
      background: #123c24;
      color: #54ef87;
    }

    .status.playing {
      background: #4b270e;
      color: #ff9b55;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 7px 0;
      border-bottom: 1px solid #202733;
      font-size: 14px;
    }

    .label { color: #8d98a8; }
    .value { text-align: right; }

    .amount {
      color: #ff8a32;
      font-weight: bold;
      font-size: 17px;
    }

    .updated {
      color: #667180;
      font-size: 11px;
      margin-top: 12px;
      text-align: right;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 50px;
    }

    .sales-summary { margin: 0 0 22px; padding: 22px; background: #111821;
      border: 1px solid #ff6a00; border-radius: 18px; }
    .sales-summary h2 { margin: 0 0 10px; font-size: 20px; }
    .sales-summary .sales-total { font-size: clamp(30px, 6vw, 42px);
      font-weight: bold; color: #ff8a32; margin: 10px 0; }
    .sales-summary p { color: #aab6c6; margin: 6px 0; line-height: 1.5; }
    .sales-summary.stale { border-color: #718096; }
    .sales-summary .sales-note { font-size: 13px; }
  [hidden] { display:none !important; }
    select {padding:12px;margin:15px;background:#121821;color:white;border:1px solid #586170;border-radius:8px;font-size:16px;}
    .report-card {min-height:75px;text-align:left;padding:20px;background:#192433;border:1px solid #465469;}
    .report-card:focus-visible, summary:focus-visible {outline:3px solid #ff8a32;}
    .metrics {display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .metrics dt {color:#aab6c6;} .metrics dd {margin:0;text-align:right;overflow-wrap:anywhere;}
    .report-note {color:#aab6c6;line-height:1.5;} details {margin:12px 0;} summary {cursor:pointer;line-height:1.6;}
    pre {white-space:pre-wrap;overflow-wrap:anywhere;} .topbar {gap:10px;flex-wrap:wrap;}

    .report-filters {display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin:20px 0;}
    .report-filters label {display:flex;flex-direction:column;gap:7px;flex:1;min-width:140px;color:#c3ccda;}
    .report-filters select {width:100%;margin:0;min-height:46px;}
    .report-tools {display:flex;flex-wrap:wrap;gap:10px;margin:18px 0;}
    .report-tools button {width:auto;margin:0;background:#263346;min-height:44px;}
    .history-note {color:#b2bfd0;line-height:1.6;}
    .report-card[aria-pressed="true"] {border-color:#ff8a32;background:#47250e;}
    .grid {align-items:start;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));}
    #report-cards {grid-template-columns:repeat(auto-fit,minmax(min(145px,100%),1fr));}
    #report-cards button {margin:0;min-height:56px;padding:14px;}
    .sales-chart {display:grid;gap:10px;margin:20px 0;}
    .sales-bar {display:grid;grid-template-columns:92px minmax(20px,1fr) 95px;gap:10px;align-items:center;font-size:14px;}
    .sales-bar-track {background:#253245;border-radius:4px;overflow:hidden;}
    .sales-bar-fill {height:16px;background:#ff7b25;min-width:0;}
    .sales-bar-amount {text-align:right;}
    #report-content {overflow-wrap:anywhere;}
    #report-content .grid .card {margin:0;}
    #report-status {color:#ffb66b;}
    @media(max-width:600px) {
      header {padding:16px 12px;} header h1 {font-size:23px;}
      .container {width:calc(100% - 24px);margin:18px auto;}
      .login {margin:30px 0;max-width:none;}
      .card {padding:14px;} .metrics {grid-template-columns:minmax(0,1fr) minmax(80px,0.7fr);font-size:15px;}
      #report-cards {grid-template-columns:repeat(2,minmax(0,1fr));}
      .report-tools button {flex:1;font-size:14px;}
      .sales-bar {grid-template-columns:82px minmax(15px,1fr) 82px;gap:6px;font-size:12px;}
      .row .value {overflow-wrap:anywhere;min-width:0;}
    }
    @media print {
      body {background:white;color:black;} header,.container:not(#reports),.topbar button,
      #owner-return,#report-cards,.report-tools,#history-status {display:none !important;}
      #reports {width:100%;} .card {background:white;border:1px solid #aaa;break-inside:avoid;}
      .metrics dt,.history-note,.report-note {color:#333;} select {color:black;background:white;}
      .report-filters {display:none;} .sales-bar-track {border:1px solid #aaa;}
    }
  </style>
</head>

<body>

<header>
  <h1>🔥 MAX FLAME LIVE</h1>
  <p>Gaming Zone • Live Monitoring</p>
</header>

<div class="container">

  <div id="login" class="login">
    <h2>MAX FLAME Login</h2>

    <input id="email" type="text" placeholder="Account email" aria-label="Account email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">

    <button onclick="login()">LOGIN</button>

    <div id="error"></div>
  </div>

  <div id="dashboard">

    <div class="topbar">
      <div>
        <strong>Station Status</strong>
        <span class="live">● LIVE</span>
      </div>

      <button id="owner-reports" hidden onclick="openReports()">Reports</button>
      <button onclick="reportLogout()">Logout</button>
    </div>

    <section id="sales-summary" class="sales-summary" aria-labelledby="sales-heading">
      <h2 id="sales-heading">Today's Total Sales</h2>
      <div id="sales-total" class="sales-total">—</div>
      <p id="sales-details">Waiting for desktop sales sync…</p>
      <p class="sales-note">Saved gaming bills, including unpaid bills. Live sessions and food are separate.</p>
      <p id="sales-updated" class="sales-note" aria-live="polite"></p>
    </section>

    <div id="stations" class="grid"></div>

  </div>

</div>

<script>
const SUPABASE_URL =
  "https://pmxbfltnwnnttoxnazjh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_o4AGn1NIGnzE82NrElk_uw_xZ09O5B5";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login() {

  document.getElementById("error").textContent = "";

  const supplied = document.getElementById("email").value.trim();
  const email = supplied;
  const password = document.getElementById("password").value;

  const { error } = await sb.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    document.getElementById("error").textContent =
      "Login failed: " + error.message;
    return;
  }

  document.getElementById("password").value = "";
  await enterAccount("Login");
}

async function logout() {
  await sb.auth.signOut();
  location.reload();
}

async function checkLogin() {

  const { data } = await sb.auth.getSession();

  if (data.session) {
    await enterAccount();
  }
}


let dashboardRefreshTimer = null;
let dashboardRefreshing = false;

async function refreshDashboard() {
  if (dashboardRefreshing) return;
  dashboardRefreshing = true;
  try {
    await Promise.allSettled([loadStations(), loadDailySales()]);
  } finally {
    dashboardRefreshing = false;
  }
}

function renderDailySales(row, error, now = Date.now()) {
  const card = document.getElementById("sales-summary");
  const heading = document.getElementById("sales-heading");
  const total = document.getElementById("sales-total");
  const details = document.getElementById("sales-details");
  const updated = document.getElementById("sales-updated");
  heading.textContent = "Today's Total Sales";
  if (error || !row) {
    total.textContent = "—";
    card.classList.add("stale");
    details.textContent = error ? "Sales total unavailable. Station status can still update." : "Waiting for the updated desktop app to send today's sales.";
    updated.textContent = error ? "Complete the daily-sales table setup and sign in with the owner account." : "No daily summary received yet.";
    return;
  }
  const amount = Number(row.total_sales);
  const count = Number(row.session_count);
  const timestamp = Date.parse(row.updated_at);
  const endsAt = Date.parse(row.business_day_ends_at);
  const valid = Number.isFinite(amount) && Number.isInteger(count) && count >= 0 &&
    Number.isFinite(timestamp) && Number.isFinite(endsAt) &&
    /^\d{4}-\d{2}-\d{2}$/.test(row.business_date || "");
  if (!valid) {
    renderDailySales(null, true, now);
    return;
  }
  const stale = now - timestamp > 120000 || now >= endsAt || timestamp > now + 120000;
  heading.textContent = stale ? "Last Synced Sales" : "Today's Total Sales";
  card.classList.toggle("stale", stale);
  total.textContent = "Rs. " + amount.toLocaleString(undefined, {maximumFractionDigits: 2});
  details.textContent = "Business day: " + row.business_date + " · " + count + " saved bill" + (count === 1 ? "" : "s");
  updated.textContent = (stale ? "Waiting for a fresh desktop update. Last synced: " : "Updated: ") + new Date(timestamp).toLocaleString();
}

async function loadDailySales() {
  try {
    const {data, error} = await sb.from("daily_sales_summary")
      .select("business_date,total_sales,session_count,business_day_ends_at,updated_at")
      .eq("id", "current").limit(1);
    renderDailySales(data && data[0], error);
  } catch (error) {
    renderDailySales(null, true);
  }
}

async function showDashboard() {

  document.getElementById("login").style.display = "none";
  document.getElementById("dashboard").style.display = "block";

  await refreshDashboard();

  if (dashboardRefreshTimer) clearInterval(dashboardRefreshTimer);
  dashboardRefreshTimer = setInterval(refreshDashboard, 3000);
}

async function loadStations() {

  const { data, error } = await sb
    .from("live_status")
    .select("*")
    .order("station");

  const area = document.getElementById("stations");

  if (error) {
    area.innerHTML =
      '<div class="empty">Unable to load live data.<br>' +
      safe(error.message) + '</div>';
    return;
  }

  area.innerHTML = "";

  data.forEach(s => {

    const status = s.status || "Available";
    const cssStatus = ["Playing","Available","Paused"].includes(status) ? status.toLowerCase() : "unavailable";

    const card = document.createElement("div");
    card.className = "card " + cssStatus;

    card.innerHTML = `
      <div class="station">${safe(s.station)}</div>

      <div class="status ${cssStatus}">
        ${safe(status)}
      </div>

      <div class="row">
        <span class="label">Customer</span>
        <span class="value">${safe(s.customer || "-")}</span>
      </div>

      <div class="row">
        <span class="label">Mode</span>
        <span class="value">${safe(s.mode || "-")}</span>
      </div>

      <div class="row">
        <span class="label">Controllers</span>
        <span class="value">${Number(s.controllers) || 0}</span>
      </div>

      <div class="row">
        <span class="label">Duration</span>
        <span class="value">${formatDuration(s.duration_seconds)}</span>
      </div>

      <div class="row">
        <span class="label">Current Bill</span>
        <span class="value amount">
          Rs. ${Number(s.amount || 0).toLocaleString()}
        </span>
      </div>

      <div class="row">
        <span class="label">Payment</span>
        <span class="value">${safe(s.payment || "-")}</span>
      </div>

      <div class="updated">
        Updated: ${formatDate(s.updated_at)}
      </div>
    `;

    area.appendChild(card);
  });
}

function formatDuration(seconds) {

  seconds = Number(seconds || 0);

  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);

  return (
    String(h).padStart(2, "0") + ":" +
    String(m).padStart(2, "0") + ":" +
    String(s).padStart(2, "0")
  );
}

function formatDate(value) {

  if (!value) return "-";

  return new Date(value).toLocaleString();
}

function safe(value) {

  const div = document.createElement("div");
  div.textContent = String(value);
  return div.innerHTML;
}


</script>

<section id="reports" class="container" hidden>
  <div class="topbar"><h2 id="report-title">Report Viewer</h2><button onclick="reportLogout()">Logout</button></div>
  <button id="owner-return" hidden onclick="returnToOwner()">Back to owner dashboard</button>
  <div class="report-filters">
    <label for="report-period">Report period
      <select id="report-period">
        <option value="today">Today</option><option value="week">This week</option><option value="month">This month</option>
        <option value="saved-month">Choose month</option><option value="saved-year">Choose year</option><option value="all">All saved records</option>
      </select>
    </label>
    <label id="year-control" for="report-year" hidden>Year<select id="report-year"></select></label>
    <label id="month-control" for="report-month" hidden>Month<select id="report-month"></select></label>
  </div>
  <p id="history-status" class="history-note" role="status"></p>
  <div class="report-tools">
    <button id="report-refresh" type="button">Refresh</button>
    <button id="export-csv" type="button" disabled>Save CSV</button>
    <button id="export-json" type="button" disabled>Save full report</button>
    <button id="print-report" type="button" disabled>Print / PDF</button>
  </div>
  <nav id="report-cards" class="grid" aria-label="Report sections"></nav>
  <main id="report-content" aria-live="polite"></main>
</section>
<script src="viewer.js?v=monthly-446"></script>
</body>
</html>
